# Example dev proxy config (adjust ports/paths per deployment).
# Game API + WebSocket go to the dedicated DEV game server (dev DB);
# sim-specific API stays on the sim process. Prod keeps its own game server + DB.

server {
    listen 5450;
    server_name localhost;
    client_max_body_size 200m;

    # Sim-specific API -> dedicated sim process (admin auth enforced there)
    location /api/sim/ {
        proxy_pass http://127.0.0.1:5451;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Everything else API (auth, worlds, snapshot, perf...) -> DEV game server (dev DB)
    location /api/ {
        proxy_pass http://127.0.0.1:5402;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Real-time multiplayer WebSocket -> DEV game server (dev DB)
    location /ws {
        proxy_pass http://127.0.0.1:5402;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
    }

    # Knowledge base (markdown) — linked from the seed visualizer + docs
    location /kb/ {
        alias <repo>/kb/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Sim UI = same bundle as the game (gating is server-side via /api/sim/access)
    # Hashed build assets are immutable even in dev; entry HTML stays fresh.
    location /assets/ {
        root <repo>/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Mirror prod caching for heavy static payloads (thumbnails/manifest/music/atlas)
    location /catalog/ {
        root <repo>/dist;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /textures/ {
        root <repo>/dist;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Ambient music: files never change in place (a new track = a new URL)
    location /music/ {
        root <repo>/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root <repo>/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
